<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>S热点正反馈弹层 Demo</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f2f2f2;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button{font:inherit}.app{position:relative;max-width:590px;min-height:100vh;margin:auto;padding-bottom:90px;background:#fff;box-shadow:0 0 40px #0000000f}.trigger{position:relative;height:793px;overflow:hidden}.trigger-top{position:relative;height:208px;overflow:hidden}.trigger-body{position:relative;height:585px;overflow:hidden}.trigger img{position:absolute;width:100%;height:auto;left:0}.trigger-top img{top:0}.trigger-body img{top:-261px}.trigger-like{position:absolute;right:0;bottom:0;width:190px;height:62px;border:0;background:#fff;color:#71717a;font-size:20px}.trigger-like.on{background:transparent;color:transparent}.interest{border-top:15px solid #f2f2f2}.interest-title{height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f4f4f5;color:#a1a1aa;font-size:20px}.post-img{display:block;width:100%;height:auto}.more{height:62px;width:100%;border:1px solid #f4f4f5;background:#fff;color:#71717a;font-size:18px}.second{border-top:10px solid #f2f2f2}.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:590px;height:90px;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff5;box-shadow:0 -4px 18px #0000000a}.bottom span{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:13px}.bottom b{font-size:27px}.shade{position:fixed;z-index:40;inset:0;background:#0009;display:none}.shade.open{display:block}.drawer{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:590px;height:76vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:18px 18px 0 0}.handle{width:40px;height:4px;background:#d4d4d8;border-radius:9px;margin:7px auto 4px}.drawer-head{position:relative;flex:none;height:52px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #f4f4f5;font-size:21px;font-weight:600}.close{position:absolute;right:14px;border:0;background:none;font-size:30px;color:#52525b}.feed{flex:1;min-height:0;overflow:auto;background:#f4f4f6}.card{position:relative;margin-bottom:10px;background:#fff;overflow:hidden}.card img{display:block;width:100%;height:auto}.first-image{height:243px;overflow:hidden;border:0;padding:0;background:#fff;width:100%}.first-image img{margin-top:-103px}.actions{height:56px;margin:0 20px;border-top:1px solid #f4f4f5;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;text-align:center;color:#71717a}.actions button{border:0;background:#fff;color:inherit}.loading{height:70px;display:none;align-items:center;justify-content:center;gap:10px;background:#fff;color:#71717a}.loading.show{display:flex}.spinner{width:20px;height:20px;border:2px solid #fed7aa;border-top-color:#f97316;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.detail{position:fixed;z-index:80;inset:0;max-width:590px;margin:auto;overflow:auto;background:#fff;display:none;box-shadow:0 0 40px #0003}.detail.open{display:block}.detail img{display:block;width:100%;height:auto}.detail-first{position:relative}.back{position:absolute;left:0;top:68px;width:70px;height:64px;border:0;background:transparent}
  </style>
</head>
<body>
  <main class="app">
    <section class="trigger">
      <div class="trigger-top"><img src="trigger-post.jpg" alt="推荐流顶部"></div>
      <div class="trigger-body"><img src="trigger-post.jpg" alt="热点博文"></div>
      <button id="triggerLike" class="trigger-like" aria-label="点赞这条博文">♡ 2.4万</button>
    </section>
    <section id="feedback" hidden>
      <div class="interest"><div class="interest-title"><span>你可能感兴趣</span><span>×</span></div></div>
      <img class="post-img" src="feedback-post.jpg" alt="正反馈博文">
      <button id="openDrawer" class="more">查看更多同热点内容　›</button>
    </section>
    <article class="second"><img class="post-img" src="second-feed-post.jpg" alt="首页第二条博文"></article>
    <nav class="bottom"><span><b>⌂</b>首页</span><span><b>▣</b>视频</span><span><b>⌕</b>发现</span><span><b>▱</b>消息</span><span><b>♙</b>我</span></nav>
  </main>

  <div id="shade" class="shade">
    <section class="drawer" role="dialog" aria-label="同热点内容">
      <div class="handle"></div><header class="drawer-head">同热点内容<button id="closeDrawer" class="close">×</button></header>
      <div id="feed" class="feed"></div>
    </section>
  </div>
  <section id="detail" class="detail" aria-label="微博正文页">
    <div class="detail-first"><img src="detail-01.jpg" alt="微博正文第一部分"><button id="back" class="back" aria-label="返回"></button></div>
    <img src="detail-02.jpg" alt="微博正文第二部分"><img src="detail-03.jpg" alt="微博正文第三部分"><img src="detail-04.jpg" alt="微博正文第四部分">
  </section>

  <script>
    const hot = Array.from({length:15},(_,i)=>`hot-post-${String(i+1).padStart(2,'0')}.jpg`);
    const more = Array.from({length:5},(_,i)=>`more-post-${String(i+1).padStart(2,'0')}.jpg`);
    const feed = document.querySelector('#feed');
    let loading=false,loaded=false;
    function card(src,index){
      const article=document.createElement('article'); article.className='card';
      if(index===0){
        article.innerHTML=`<button class="first-image" aria-label="打开第一条博文"><img src="${src}" alt="同热点博文 1"></button><div class="actions"><span>↗ 47</span><button class="comment">▱ 135</button><span>♧ 1.1万</span></div>`;
        article.querySelector('.first-image').onclick=openDetail; article.querySelector('.comment').onclick=openDetail;
      }else article.innerHTML=`<img src="${src}" alt="同热点博文 ${index+1}">`;
      return article;
    }
    hot.forEach((src,i)=>feed.append(card(src,i)));
    const load=document.createElement('div');load.className='loading';load.innerHTML='<i class="spinner"></i><span>加载更多内容</span>';feed.append(load);
    feed.addEventListener('scroll',()=>{if(loading||loaded||feed.scrollHeight-feed.scrollTop-feed.clientHeight>100)return;loading=true;load.classList.add('show');setTimeout(()=>{load.classList.remove('show');more.forEach((src,i)=>feed.append(card(src,15+i)));loaded=true;loading=false},900)});
    document.querySelector('#triggerLike').onclick=e=>{e.currentTarget.classList.add('on');document.querySelector('#feedback').hidden=false};
    document.querySelector('#openDrawer').onclick=()=>document.querySelector('#shade').classList.add('open');
    document.querySelector('#closeDrawer').onclick=()=>document.querySelector('#shade').classList.remove('open');
    document.querySelector('#shade').onclick=e=>{if(e.target.id==='shade')e.currentTarget.classList.remove('open')};
    function openDetail(){document.querySelector('#detail').classList.add('open')}
    document.querySelector('#back').onclick=()=>document.querySelector('#detail').classList.remove('open');
  </script>
</body>
</html>
